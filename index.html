
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sastre Veloz - Multijugador Directo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <style>
        body { user-select: none; overscroll-behavior: none; }
        .screen { display: none; }
        .screen.active { display: flex; }
        
        /* Solución Bug Safari 3D */
        .perspective-1000 { perspective: 1000px; -webkit-perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        
        .rotate-y-180 { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
        .rotate-y-0 { transform: rotateY(0deg); -webkit-transform: rotateY(0deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); -webkit-transition: -webkit-transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        .bell-shadow { box-shadow: 0 8px 0 #991b1b, 0 15px 20px rgba(0,0,0,0.4); }
        .bell-shadow:active { box-shadow: 0 0px 0 #991b1b, 0 5px 10px rgba(0,0,0,0.4); transform: translateY(8px); }
        .bell-disabled { opacity: 0.5; box-shadow: 0 4px 0 #5c1010; transform: translateY(4px); cursor: not-allowed; }

        .cloth-container {
            width: 320px; height: 320px;
            background-color: #f3f4f6;
            position: relative; overflow: hidden;
            border: 4px solid #374151; border-radius: 8px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .tool-frame {
            position: absolute; width: 100px; height: 100px;
            cursor: grab; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            touch-action: none; z-index: 10;
        }
        .tool-frame:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen w-full flex flex-col font-sans overflow-hidden">

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="screen active flex-col items-center justify-center min-h-screen px-4">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-yellow-500 mb-4"></div>
        <p class="text-gray-400 text-center font-bold">Iniciando motor de conexión...</p>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen flex-col items-center justify-center min-h-screen px-4 py-8 overflow-y-auto">
        <h1 class="text-4xl md:text-6xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 text-center leading-tight">
            Sastre Veloz <br><span class="text-2xl md:text-3xl text-blue-400">P2P Directo</span>
        </h1>
        
        <div class="bg-slate-800 border-2 border-slate-700 p-6 rounded-2xl shadow-2xl w-full max-w-sm flex flex-col gap-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2 font-bold">TU NOMBRE DE JUGADOR</label>
                <input type="text" id="player-name" placeholder="Ej. Sastre Maestro" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-yellow-400 focus:outline-none transition-colors">
            </div>
            
            <div class="border-t border-slate-700 pt-6">
                <button onclick="createRoom()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold p-4 rounded-lg shadow-lg hover:shadow-yellow-500/50 transition-all mb-4 transform hover:-translate-y-1">
                    Crear Sala (Anfitrión)
                </button>
                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="CÓDIGO" maxlength="4" class="w-2/3 uppercase bg-slate-900 border border-slate-600 rounded-lg p-4 text-white text-center font-bold tracking-widest focus:border-blue-400 focus:outline-none">
                    <button onclick="joinRoom()" class="w-1/3 bg-blue-500 hover:bg-blue-400 text-white font-bold p-4 rounded-lg shadow-lg transition-all">
                        Unirse
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- WAITING ROOM -->
    <div id="waiting-screen" class="screen flex-col items-center justify-center min-h-screen px-4 py-8">
        <h2 class="text-3xl font-bold mb-6 text-white">Sala Directa</h2>
        <div class="bg-slate-900 border-4 border-slate-700 px-10 py-6 rounded-2xl shadow-xl mb-8 transform hover:scale-105 transition-transform">
            <p class="text-gray-400 text-sm text-center mb-2 font-bold">CÓDIGO DE INVITACIÓN</p>
            <p id="display-room-code" class="text-6xl font-mono text-yellow-400 font-bold tracking-widest text-center"></p>
        </div>
        
        <p id="waiting-players-list" class="text-xl mb-8 text-blue-300 text-center bg-slate-800 py-2 px-6 rounded-full border border-slate-700">Esperando conexión...</p>
        
        <button id="start-game-btn" onclick="startGame()" style="display:none;" class="bg-green-500 text-white font-bold text-2xl px-10 py-5 rounded-xl shadow-green-500/50 shadow-lg hover:bg-green-400 transition-all animate-bounce">
            ¡Empezar Partida!
        </button>
        <p id="waiting-host-msg" class="text-gray-500 italic mt-4 text-center">Envíale el código a tu rival y espera a que se conecte...</p>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen flex-col min-h-screen w-full relative">
        <!-- HUD Superior Compacto -->
        <div class="flex justify-between items-center bg-slate-800 border-b border-slate-700 px-4 py-2 sticky top-0 z-20 shadow-md">
            <div class="flex flex-col">
                <span class="text-[10px] text-gray-400 font-bold uppercase truncate max-w-[80px]">TÚ (<span id="ui-my-name">...</span>)</span>
                <span id="my-score" class="text-2xl font-bold text-yellow-400 leading-none">0</span>
            </div>
            <div class="flex flex-col items-center bg-slate-900 px-4 py-1 rounded-full border border-slate-700">
                <span class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Ronda</span>
                <span id="round-display" class="text-xl font-bold text-white leading-none">1</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[10px] text-gray-400 font-bold uppercase truncate max-w-[80px]">RIVAL (<span id="opp-name">...</span>)</span>
                <span id="opp-score" class="text-2xl font-bold text-blue-400 leading-none">0</span>
            </div>
        </div>

        <!-- Área Central (Tarjeta y Timbre) Optimizado para espacio -->
        <div class="flex flex-row items-center justify-center bg-slate-800 gap-6 py-4 px-2 relative shrink-0">
            <!-- Mazo 3D -->
            <div class="w-28 h-28 perspective-1000 shrink-0">
                <div id="target-card" class="w-full h-full relative transform-style-3d rotate-y-0 card-transition">
                    <!-- Reverso: Icono -->
                    <div class="absolute w-full h-full backface-hidden bg-white rounded-xl shadow-lg border-4 border-gray-300 flex flex-col items-center justify-center">
                        <p class="text-gray-500 font-bold text-[10px] mb-1 tracking-widest">BUSCAR</p>
                        <div id="card-tool-icon" class="w-14 h-14 flex items-center justify-center"></div>
                    </div>
                    <!-- Anverso: Patrón a buscar. IMPORTANTE: Sin overflow-hidden aquí para evitar el bug de iOS Safari -->
                    <div class="absolute w-full h-full backface-hidden bg-white rounded-xl shadow-lg border-4 border-gray-300 rotate-y-180 flex flex-col items-center justify-center">
                        <!-- El overflow hidden se aplica solo a este div interior -->
                        <div id="card-pattern-view" style="width: 100px; height: 100px; position: relative; overflow: hidden; border-radius: 6px;"></div>
                    </div>
                </div>
            </div>

            <!-- Timbre -->
            <button id="bell-btn" class="w-20 h-20 bg-red-600 rounded-full bell-shadow flex items-center justify-center border-4 border-red-800 transition-all focus:outline-none shrink-0" onclick="hitBell()">
                <span class="font-bold text-white text-lg tracking-tighter">TIMBRE</span>
            </button>
        </div>

        <!-- Tablero de Juego Personal -->
        <div class="bg-slate-900 p-2 md:p-6 flex-1 flex justify-center items-start shadow-inner overflow-hidden">
            <div class="cloth-container" id="cloth-board">
                <!-- SVG inyectado por JS -->
                <!-- Marcos -->
                <div id="tool-shirt" class="tool-frame" style="transform: translate(10px, 210px);" data-x="10" data-y="210" data-type="shirt">
                    <svg viewBox="0 0 100 100" width="100" height="100" class="drop-shadow-lg">
                        <path d="M0,0 L100,0 L100,100 L0,100 Z M10,20 Q50,0 90,20 L100,50 Q85,60 75,50 L75,90 Q50,100 25,90 L25,50 Q15,60 0,50 Z" fill-rule="evenodd" fill="#3b82f6" fill-opacity="0.95" stroke="#1e3a8a" stroke-width="2"/>
                    </svg>
                </div>
                <div id="tool-pants" class="tool-frame" style="transform: translate(210px, 210px);" data-x="210" data-y="210" data-type="pants">
                    <svg viewBox="0 0 100 100" width="100" height="100" class="drop-shadow-lg">
                        <path d="M0,0 L100,0 L100,100 L0,100 Z M20,10 Q50,0 80,10 L85,90 Q70,95 60,90 L50,45 L40,90 Q30,95 15,90 Z" fill-rule="evenodd" fill="#10b981" fill-opacity="0.95" stroke="#064e3b" stroke-width="2"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- OVERLAY DE VERIFICACIÓN -->
    <div id="verify-screen" class="screen absolute inset-0 z-50 bg-slate-900/95 flex-col items-center justify-center backdrop-blur-sm">
        <h2 id="verify-title" class="text-3xl font-bold text-white mb-8 text-center px-4 animate-pulse"></h2>
        <div class="bg-white rounded-2xl p-8 flex flex-col items-center shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <div id="verify-icon" class="w-20 h-20 mb-4"></div>
            <p id="verify-message" class="text-2xl text-center"></p>
        </div>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="end-screen" class="screen flex-col items-center justify-center min-h-screen bg-slate-900 relative z-50 px-4 py-8">
        <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-4 text-center">Partida Terminada</h1>
        <h2 id="winner-name" class="text-3xl font-bold text-white mb-8 text-center"></h2>
        <div id="end-scores" class="flex gap-4 mb-10 w-full justify-center"></div>
        <button onclick="window.location.reload()" class="bg-white text-slate-900 font-bold text-lg px-8 py-4 rounded-xl shadow-lg hover:bg-gray-200 transition-colors">Volver al Menú</button>
    </div>

    <script>
        // ==========================================
        // MOTOR LÓGICO Y DE RED P2P (PeerJS)
        // ==========================================

        const CLOTH_SIZE = 320;
        const TOOL_SIZE = 100;
        const TOLERANCE = 25; 
        const PREFIX = 'sastre-game-p2p-v2-'; // Prefijo único para aislar versiones

        window.game = {
            peer: null, conn: null, isHost: false,
            myName: '', oppName: '',
            scores: { host: 0, guest: 0 },
            currentRound: 0, targets: [],
            isLocalRoundActive: false, clothSVG: '',
            tools: { shirt: {x:10, y:210}, pants: {x:210, y:210} }
        };

        const showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // 1. Generación de tablero seguro
        const generateMasterPattern = () => {
            const colors = ['#0f308a', '#93c5fd', '#fbbf24', '#f97316', '#ef4444', '#10b981'];
            const w = CLOTH_SIZE / 4; 
            let svg = '';
            
            const cells = [
                `<rect x="0" y="0" width="${w/2}" height="${w}" fill="${colors[2]}"/><rect x="${w/2}" y="0" width="${w/2}" height="${w}" fill="${colors[0]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w/2}" fill="${colors[0]}"/><rect x="0" y="${w/2}" width="${w}" height="${w/2}" fill="${colors[1]}"/>`,
                `<polygon points="0,0 ${w},0 0,${w}" fill="${colors[3]}"/><polygon points="${w},0 ${w},${w} 0,${w}" fill="${colors[0]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[1]}"/><circle cx="${w}" cy="0" r="${w/1.5}" fill="${colors[3]}" opacity="0.8"/><circle cx="0" cy="${w}" r="${w/1.5}" fill="${colors[2]}" opacity="0.8"/>`,
                `<polygon points="0,0 ${w},0 ${w/2},${w}" fill="${colors[4]}"/><polygon points="0,0 ${w/2},${w} 0,${w}" fill="${colors[1]}"/><polygon points="${w},0 ${w},${w} ${w/2},${w}" fill="${colors[1]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[2]}"/><rect x="${w*0.2}" y="0" width="${w*0.2}" height="${w}" fill="${colors[0]}"/><rect x="${w*0.6}" y="0" width="${w*0.2}" height="${w}" fill="${colors[0]}"/>`,
                `<polygon points="0,0 ${w},${w} 0,${w}" fill="${colors[1]}"/><polygon points="0,0 ${w},0 ${w},${w}" fill="${colors[0]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[3]}"/><line x1="0" y1="0" x2="${w}" y2="${w}" stroke="${colors[2]}" stroke-width="10"/><line x1="${w*0.5}" y1="-${w*0.5}" x2="${w*1.5}" y2="${w*0.5}" stroke="${colors[2]}" stroke-width="10"/><line x1="-${w*0.5}" y1="${w*0.5}" x2="${w*0.5}" y2="${w*1.5}" stroke="${colors[2]}" stroke-width="10"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[1]}"/><path d="M ${w},0 A ${w/2} ${w/2} 0 0 1 ${w},${w} L ${w},0" fill="${colors[2]}"/>`,
                `<polygon points="0,${w} ${w},0 ${w},${w}" fill="${colors[3]}"/><polygon points="0,0 ${w},0 0,${w}" fill="${colors[0]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[0]}"/><polygon points="${w},${w} 0,${w} 0,${w*0.75} ${w*0.25},${w*0.75} ${w*0.25},${w*0.5} ${w*0.5},${w*0.5} ${w*0.5},${w*0.25} ${w*0.75},${w*0.25} ${w*0.75},0 ${w},0" fill="#ffb4a2"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[0]}"/><rect x="0" y="${w*0.3}" width="${w}" height="${w*0.15}" fill="${colors[4]}"/><rect x="0" y="${w*0.55}" width="${w}" height="${w*0.15}" fill="${colors[2]}"/><rect x="0" y="${w*0.8}" width="${w}" height="${w*0.15}" fill="${colors[4]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[2]}"/><circle cx="${w/2}" cy="${w/2}" r="${w*0.35}" fill="${colors[3]}"/><circle cx="${w/2}" cy="${w/2}" r="${w*0.15}" fill="${colors[1]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[0]}"/><polygon points="${w/2},${w*0.1} ${w*0.9},${w*0.9} ${w*0.1},${w*0.9}" fill="${colors[1]}"/>`,
                `<rect x="0" y="0" width="${w}" height="${w}" fill="${colors[1]}"/><circle cx="${w*0.35}" cy="${w*0.35}" r="${w*0.2}" fill="${colors[3]}"/><circle cx="${w*0.65}" cy="${w*0.35}" r="${w*0.2}" fill="${colors[3]}"/><circle cx="${w*0.35}" cy="${w*0.65}" r="${w*0.2}" fill="${colors[3]}"/><circle cx="${w*0.65}" cy="${w*0.65}" r="${w*0.2}" fill="${colors[3]}"/>`,
                `<rect x="0" y="0" width="${w/2}" height="${w/2}" fill="${colors[0]}"/><rect x="${w/2}" y="0" width="${w/2}" height="${w/2}" fill="${colors[2]}"/><rect x="0" y="${w/2}" width="${w/2}" height="${w/2}" fill="${colors[2]}"/><rect x="${w/2}" y="${w/2}" width="${w/2}" height="${w/2}" fill="${colors[3]}"/>`
            ];

            cells.forEach((cell, i) => {
                const r = Math.floor(i / 4);
                const c = i % 4;
                svg += `<g transform="translate(${c * w}, ${r * w})">${cell}</g>`;
            });

            game.clothSVG = `<svg width="${CLOTH_SIZE}" height="${CLOTH_SIZE}" viewBox="0 0 ${CLOTH_SIZE} ${CLOTH_SIZE}" xmlns="http://www.w3.org/2000/svg" style="position:absolute; top:0; left:0; z-index:0; border-radius:8px;">${svg}</svg>`;
            document.getElementById('cloth-board').insertAdjacentHTML('afterbegin', game.clothSVG);
        };

        // 2. Conexión de Red P2P
        const setupConnection = (conn) => {
            game.conn = conn;
            
            conn.on('open', () => {
                conn.send({ type: 'INIT_NAME', name: game.myName });
                document.getElementById('waiting-players-list').innerText = "Conexión establecida. Sincronizando...";
            });

            conn.on('data', (data) => {
                switch(data.type) {
                    case 'INIT_NAME':
                        game.oppName = data.name;
                        document.getElementById('waiting-players-list').innerText = `¡${game.myName} vs ${game.oppName}!`;
                        document.getElementById('opp-name').innerText = game.oppName;
                        if (game.isHost) {
                            document.getElementById('waiting-host-msg').style.display = 'none';
                            document.getElementById('start-game-btn').style.display = 'block';
                        } else {
                            document.getElementById('waiting-host-msg').innerText = "Todo listo. Esperando a que el Anfitrión empiece...";
                        }
                        break;
                    case 'START_GAME':
                        game.targets = data.targets;
                        game.scores = { host: 0, guest: 0 };
                        startRound(0);
                        break;
                    case 'BELL_HIT': 
                        if (game.isHost && game.isLocalRoundActive) {
                            setBellState(false);
                            processBellResult('guest', data.correct);
                        }
                        break;
                    case 'VERIFY_RESULT': 
                        setBellState(false);
                        game.scores = data.scores; 
                        updateScoreUI();
                        showVerificationUI(data.player, data.correct);
                        break;
                    case 'NEXT_ROUND':
                        startRound(data.roundIndex);
                        break;
                    case 'END_GAME':
                        endGame();
                        break;
                }
            });

            conn.on('close', () => alert('El rival se ha desconectado.'));
        };

        window.createRoom = () => {
            game.myName = document.getElementById('player-name').value || 'Anfitrión';
            const code = Array.from({length: 4}, () => 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random() * 26)]).join('');
            
            showScreen('loading-screen');
            game.isHost = true;
            
            game.peer = new Peer(PREFIX + code);
            game.peer.on('open', () => {
                showScreen('waiting-screen');
                document.getElementById('display-room-code').innerText = code;
            });
            
            game.peer.on('connection', (conn) => setupConnection(conn));
            
            game.peer.on('error', () => {
                alert("Error creando la sala. Intenta de nuevo.");
                showScreen('lobby-screen');
            });
        };

        window.joinRoom = () => {
            game.myName = document.getElementById('player-name').value || 'Invitado';
            const code = document.getElementById('room-code-input').value.toUpperCase();
            if (code.length !== 4) return alert("Código inválido (Debe tener 4 letras)");

            showScreen('loading-screen');
            game.isHost = false;

            game.peer = new Peer(); 
            game.peer.on('open', () => {
                showScreen('waiting-screen');
                document.getElementById('display-room-code').innerText = code;
                document.getElementById('waiting-host-msg').innerText = "Conectando al anfitrión...";
                const conn = game.peer.connect(PREFIX + code);
                setupConnection(conn);
            });

            game.peer.on('error', () => {
                alert("No se encontró la sala. Comprueba el código.");
                showScreen('lobby-screen');
            });
        };

        // 3. Flujo del Juego y Reflow de Animación
        window.startGame = () => {
            game.targets = Array.from({length: 5}, () => ({
                x: Math.floor(Math.random() * (CLOTH_SIZE - TOOL_SIZE)),
                y: Math.floor(Math.random() * (CLOTH_SIZE - TOOL_SIZE)),
                tool: Math.random() > 0.5 ? 'shirt' : 'pants'
            }));
            game.conn.send({ type: 'START_GAME', targets: game.targets });
            startRound(0);
        };

        const startRound = (index) => {
            game.currentRound = index;
            document.getElementById('round-display').innerText = index + 1;
            document.getElementById('ui-my-name').innerText = game.myName;
            document.getElementById('opp-name').innerText = game.oppName;
            updateScoreUI();
            
            prepareCard(game.targets[index]);
            showScreen('game-screen');
            
            setBellState(false); 
            
            const card = document.getElementById('target-card');
            
            // EL TRUCO DEL REFLOW: 
            // 1. Quitar transición y forzar la rotación a 0 al instante
            card.classList.remove('card-transition');
            card.classList.remove('rotate-y-180');
            card.classList.add('rotate-y-0');
            
            // 2. Forzar al navegador a redibujar el elemento (Reflow)
            void card.offsetWidth;

            // 3. Devolver la clase de transición
            card.classList.add('card-transition');

            // 4. Voltear después del tiempo de preparación
            setTimeout(() => {
                card.classList.remove('rotate-y-0');
                card.classList.add('rotate-y-180');
                setBellState(true);
            }, 1500);
        };

        const setBellState = (active) => {
            game.isLocalRoundActive = active;
            const btn = document.getElementById('bell-btn');
            if (active) {
                btn.disabled = false;
                btn.classList.remove('bell-disabled');
            } else {
                btn.disabled = true;
                btn.classList.add('bell-disabled');
            }
        };

        const prepareCard = (target) => {
            const shirtIcon = `<svg viewBox="0 0 100 100" width="40" height="40"><path d="M10,20 Q50,0 90,20 L100,50 Q85,60 75,50 L75,90 Q50,100 25,90 L25,50 Q15,60 0,50 Z" fill="#3b82f6"/></svg>`;
            const pantsIcon = `<svg viewBox="0 0 100 100" width="40" height="40"><path d="M20,10 Q50,0 80,10 L85,90 Q70,95 60,90 L50,45 L40,90 Q30,95 15,90 Z" fill="#10b981"/></svg>`;
            
            document.getElementById('card-tool-icon').innerHTML = target.tool === 'shirt' ? shirtIcon : pantsIcon;

            // Plantilla blanca con recorte de la forma exacta
            const cutoutSVG = target.tool === 'shirt'
                ? `<svg viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; z-index: 10; width: 100px; height: 100px;"><path d="M0,0 L100,0 L100,100 L0,100 Z M10,20 Q50,0 90,20 L100,50 Q85,60 75,50 L75,90 Q50,100 25,90 L25,50 Q15,60 0,50 Z" fill-rule="evenodd" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/></svg>`
                : `<svg viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; z-index: 10; width: 100px; height: 100px;"><path d="M0,0 L100,0 L100,100 L0,100 Z M20,10 Q50,0 80,10 L85,90 Q70,95 60,90 L50,45 L40,90 Q30,95 15,90 Z" fill-rule="evenodd" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/></svg>`;

            document.getElementById('card-pattern-view').innerHTML = `
                <div style="position: absolute; top: 0; left: 0; transform: translate(-${target.x}px, -${target.y}px); width: ${CLOTH_SIZE}px; height: ${CLOTH_SIZE}px;">
                    ${game.clothSVG}
                </div>
                ${cutoutSVG}
            `;
        };

        window.hitBell = () => {
            if (!game.isLocalRoundActive) return;
            setBellState(false); 

            const target = game.targets[game.currentRound];
            const activeTool = document.getElementById(`tool-${target.tool}`);
            
            const tX = parseFloat(activeTool.dataset.x);
            const tY = parseFloat(activeTool.dataset.y);
            
            const isCorrect = Math.hypot(tX - target.x, tY - target.y) <= TOLERANCE;

            if (game.isHost) {
                processBellResult('host', isCorrect);
            } else {
                game.conn.send({ type: 'BELL_HIT', correct: isCorrect });
            }
        };

        const processBellResult = (player, correct) => {
            if (correct) game.scores[player]++;
            else game.scores[player === 'host' ? 'guest' : 'host']++;

            game.conn.send({ type: 'VERIFY_RESULT', player: player, correct: correct, scores: game.scores });
            
            updateScoreUI();
            showVerificationUI(player, correct);

            setTimeout(() => {
                if (game.currentRound + 1 >= 5) {
                    game.conn.send({ type: 'END_GAME' });
                    endGame();
                } else {
                    game.conn.send({ type: 'NEXT_ROUND', roundIndex: game.currentRound + 1 });
                    startRound(game.currentRound + 1);
                }
            }, 3000);
        };

        const showVerificationUI = (player, correct) => {
            const ringerName = player === (game.isHost ? 'host' : 'guest') ? game.myName : game.oppName;
            document.getElementById('verify-title').innerText = `¡${ringerName} tocó el timbre!`;
            document.getElementById('verify-screen').classList.add('active');
            
            setTimeout(() => {
                if (correct) {
                    document.getElementById('verify-icon').innerHTML = `<svg stroke="#10b981" fill="none" viewBox="0 0 24 24"><path stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
                    document.getElementById('verify-message').innerText = "¡Encuadre Perfecto!";
                    document.getElementById('verify-message').className = "text-3xl md:text-4xl font-bold text-green-500 text-center";
                } else {
                    document.getElementById('verify-icon').innerHTML = `<svg stroke="#ef4444" fill="none" viewBox="0 0 24 24"><path stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;
                    document.getElementById('verify-message').innerText = "¡Falló! Tela equivocada.";
                    document.getElementById('verify-message').className = "text-3xl md:text-4xl font-bold text-red-500 text-center";
                }
            }, 800);

            setTimeout(() => { 
                document.getElementById('verify-screen').classList.remove('active'); 
                document.getElementById('verify-icon').innerHTML=''; 
                document.getElementById('verify-message').innerText=''; 
            }, 2900);
        };

        const updateScoreUI = () => {
            if (game.isHost) {
                document.getElementById('my-score').innerText = game.scores.host;
                document.getElementById('opp-score').innerText = game.scores.guest;
            } else {
                document.getElementById('my-score').innerText = game.scores.guest;
                document.getElementById('opp-score').innerText = game.scores.host;
            }
        };

        const endGame = () => {
            showScreen('end-screen');
            let winnerName = "";
            if (game.scores.host > game.scores.guest) {
                winnerName = game.isHost ? game.myName : game.oppName;
            } else if (game.scores.guest > game.scores.host) {
                winnerName = !game.isHost ? game.myName : game.oppName;
            } else {
                winnerName = "¡Empate!";
            }

            document.getElementById('winner-name').innerText = winnerName === "¡Empate!" ? winnerName : `¡${winnerName} Gana!`;
            
            document.getElementById('end-scores').innerHTML = `
                <div class="bg-slate-800 border-2 border-slate-700 p-4 md:p-8 rounded-2xl text-center shadow-lg w-1/2 max-w-[200px]"><p class="text-gray-400 font-bold mb-2 uppercase tracking-wide truncate">${game.myName}</p><p class="text-5xl md:text-6xl text-yellow-400 font-bold">${game.isHost ? game.scores.host : game.scores.guest}</p></div>
                <div class="bg-slate-800 border-2 border-slate-700 p-4 md:p-8 rounded-2xl text-center shadow-lg w-1/2 max-w-[200px]"><p class="text-gray-400 font-bold mb-2 uppercase tracking-wide truncate">${game.oppName}</p><p class="text-5xl md:text-6xl text-blue-400 font-bold">${game.isHost ? game.scores.guest : game.scores.host}</p></div>
            `;
        };

        // 4. Mecánica de Control 
        const makeDraggable = (element, toolType) => {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            const startDrag = (e) => {
                if (!game.isLocalRoundActive) return;
                isDragging = true;
                element.setPointerCapture(e.pointerId);
                startX = e.clientX; startY = e.clientY;
                
                initialX = parseFloat(element.dataset.x);
                initialY = parseFloat(element.dataset.y);
                element.style.zIndex = 20;
            };

            const moveDrag = (e) => {
                if (!isDragging) return;
                let newX = initialX + (e.clientX - startX);
                let newY = initialY + (e.clientY - startY);
                
                newX = Math.max(0, Math.min(newX, CLOTH_SIZE - TOOL_SIZE));
                newY = Math.max(0, Math.min(newY, CLOTH_SIZE - TOOL_SIZE));

                element.style.transform = `translate(${newX}px, ${newY}px)`;
                element.dataset.x = newX; 
                element.dataset.y = newY;
            };

            const endDrag = (e) => {
                isDragging = false;
                element.releasePointerCapture(e.pointerId);
                element.style.zIndex = 10;
            };

            element.addEventListener('pointerdown', startDrag);
            element.addEventListener('pointermove', moveDrag);
            element.addEventListener('pointerup', endDrag);
            element.addEventListener('pointercancel', endDrag);
        };

        window.onload = () => {
            generateMasterPattern();
            makeDraggable(document.getElementById('tool-shirt'), 'shirt');
            makeDraggable(document.getElementById('tool-pants'), 'pants');
            showScreen('lobby-screen');
        };

    </script>
</body>
</html>
